<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 48px;
            width: 92%;
            max-width: 560px;
            min-height: 520px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.3),
                        inset 0 -1px 0 rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }
               .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, 
                        rgba(255, 255, 255, 0.6) 0%,
                        rgba(255, 255, 255, 0.2) 25%,
                        rgba(255, 255, 255, 0.1) 50%,
                        rgba(255, 255, 255, 0.2) 75%,
                        rgba(255, 255, 255, 0.6) 100%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            z-index: -1;
        }


        .user-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 182, 193, 0.8);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #4A90E2;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            color: #333;
            font-weight: 500;
            min-width: 80px;
        }

        .form-group input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            font-size: 12px;
            color: #999;
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
        }

        .register-btn {
            width: 50%;
            padding: 15px;
            background: rgba(255, 182, 193, 0.8);
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px auto 0;
            display: block;
        }

        .register-btn:hover {
            background: rgba(255, 182, 193, 1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4A90E2;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #357ABD;
            text-decoration: underline;
        }

        .code-btn {
            white-space: nowrap;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            background: rgba(74, 144, 226, 0.9);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .code-btn:disabled {
            background: rgba(74, 144, 226, 0.4);
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
                min-height: auto;
            }
            
            .form-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .form-group label {
                min-width: auto;
            }
            
            .form-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="back-link">← Back to Login</a>
        
        <div class="user-icon">👤</div>
        
        <form id="register-form">
            <div class="form-group">
                <label for="account">Account</label>
                <input type="text" id="account" name="account" placeholder="Please input your username">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Please input your email" minlength="5">
            </div>

            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" placeholder="Verification code">
                <button type="button" id="get-code-btn" class="code-btn">Get Code</button>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Please input your password" minlength="6">
            </div>
            
            <button type="submit" class="register-btn">Register</button>
        </form>
    </div>

<script src="config.js"></script>
<script>
    (function () {
        var emailInput = document.getElementById('email');
        var getCodeBtn = document.getElementById('get-code-btn');
        var form = document.getElementById('register-form');
        var timer = null;
        var remain = 60;

        function isEmailValid(value) {
            if (!value) return false;
            if (value.length < 5) return false;
            if (value.indexOf('@') === -1) return false;
            return true;
        }

        function startCountdown() {
            getCodeBtn.disabled = true;
            remain = 60;
            getCodeBtn.textContent = 'Resend (' + remain + 's)';
            timer = setInterval(function () {
                remain -= 1;
                if (remain <= 0) {
                    clearInterval(timer);
                    getCodeBtn.disabled = false;
                    getCodeBtn.textContent = 'Get Code';
                } else {
                    getCodeBtn.textContent = 'Resend (' + remain + 's)';
                }
            }, 1000);
        }

        getCodeBtn.addEventListener('click', function () {
            var email = emailInput.value.trim();
            if (!isEmailValid(email)) {
                alert('Please input a valid email.');
                return;
            }
            var body = new URLSearchParams();
            body.set('email', email);

            fetch(getApiUrl(API_ENDPOINTS.USER_SEND_VERIFICATION_CODE), {
                method: 'POST',
                body: body
            }).catch(function () { /* 供后端捕捉 */ });
            startCountdown();
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var username = (document.getElementById('account').value || '').trim();
            var email = emailInput.value.trim();
            var code = (document.getElementById('code').value || '').trim();
            var pwd = document.getElementById('password').value || '';

            if (!username) {
                alert('Username is required.');
                return;
            }
            if (!isEmailValid(email)) {
                alert('Email is invalid.');
                return;
            }
            if (!code) {
                alert('Verification code is required.');
                return;
            }
            if (pwd.length < 6) {
                alert('Password must be at least 6 characters.');
                return;
            }

            var body = new URLSearchParams();
            body.set('username', username);
            body.set('email', email);
            body.set('password', pwd);
            body.set('verificationCode', code);

            fetch(getApiUrl(API_ENDPOINTS.USER_REGISTER), {
                method: 'POST',
                body: body
            })
            .then(function (response) {
                // 首先检查响应状态
                if (!response.ok) {
                    // 如果响应不成功，尝试解析错误信息
                    return response.text().then(function(text) {
                        let errorData;
                        try {
                            errorData = JSON.parse(text);
                        } catch (e) {
                            // 如果无法解析为JSON，使用原始文本
                            throw new Error(text || '请求失败，状态码: ' + response.status);
                        }
                        throw new Error(JSON.stringify({
                            status: response.status,
                            data: errorData
                        }));
                    });
                }
                // 响应成功，解析JSON
                return response.json();
            })
            .then(function(data) {
                // 成功处理 - 状态码为201
                alert(data.message || '用户注册成功');
                window.location.href = 'Login.html';
            })
            .catch(function(error) {
                console.error('请求失败:', error);
                
                try {
                    // 尝试解析错误信息
                    const errorObj = JSON.parse(error.message);
                    if (errorObj.status === 409) {
                        alert(errorObj.data.error || '注册失败：邮箱已被使用');
                    } else if (errorObj.status === 400) {
                        alert(errorObj.data.error || '注册失败：验证码错误或已失效');
                    } else if (errorObj.status === 500) {
                        alert(errorObj.data.error || '注册失败：发生未知错误');
                    } else {
                        alert(errorObj.data.error || '注册失败：未知错误');
                    }
                } catch (e) {
                    // 如果无法解析为JSON，显示原始错误信息
                    if (error.message.includes('Failed to fetch')) {
                        alert('网络错误，请检查连接后重试');
                    } else {
                        alert(error.message || '注册失败，请稍后重试');
                    }
                }
            });
        });
    })();
</script>
</body>
</html>
