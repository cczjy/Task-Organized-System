<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>change-password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 48px;
            width: 92%;
            max-width: 560px;
            min-height: 560px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.3),
                        inset 0 -1px 0 rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }
               .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, 
                        rgba(255, 255, 255, 0.6) 0%,
                        rgba(255, 255, 255, 0.2) 25%,
                        rgba(255, 255, 255, 0.1) 50%,
                        rgba(255, 255, 255, 0.2) 75%,
                        rgba(255, 255, 255, 0.6) 100%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            z-index: -1;
        }


        .user-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 182, 193, 0.8);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #4A90E2;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            color: #333;
            font-weight: 500;
            min-width: 80px;
        }

        .form-group input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            font-size: 12px;
            color: #999;
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
        }

        .confirm-btn {
            width: 50%;
            padding: 15px;
            background: rgba(255, 182, 193, 0.8);
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px auto 0;
            display: block;
        }

        .confirm-btn:hover {
            background: rgba(255, 182, 193, 1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4A90E2;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #357ABD;
            text-decoration: underline;
        }

        .code-btn {
            white-space: nowrap;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            background: rgba(74, 144, 226, 0.9);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .code-btn:disabled {
            background: rgba(74, 144, 226, 0.4);
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
                min-height: auto;
            }
            
            .form-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .form-group label {
                min-width: auto;
            }
            
            .form-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="back-link">← Back to Login</a>
        
        <div class="user-icon">👤</div>
        
        <form id="change-form">
            <div class="form-group">
                <label for="account">Account</label>
                <input type="text" id="account" name="account" placeholder="Please input your email">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Please input your email" minlength="5">
            </div>

            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" placeholder="Verification code">
                <button type="button" id="get-code-btn" class="code-btn">Get Code</button>
            </div>

            <div class="form-group">
                <label for="previous">Old one</label>
                <input type="password" id="previous" name="previous" placeholder="Please input your old password">
            </div>
            
            <div class="form-group">
                <label for="newone">New one</label>
                <input type="password" id="newone" name="newone" placeholder="Please input your new password" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmNew">Confirm</label>
                <input type="password" id="confirmNew" name="confirmNew" placeholder="Please confirm your new password" minlength="6">
            </div>
            
            <button type="submit" class="confirm-btn">Confirm</button>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        (function () {
            var emailInput = document.getElementById('email');
            var getCodeBtn = document.getElementById('get-code-btn');
            var form = document.getElementById('change-form');
            var timer = null;
            var remain = 60;

            function isEmailValid(value) {
                if (!value) return false;
                if (value.length < 5) return false;
                if (value.indexOf('@') === -1) return false;
                return true;
            }

            function startCountdown() {
                getCodeBtn.disabled = true;
                remain = 60;
                getCodeBtn.textContent = 'Resend (' + remain + 's)';
                timer = setInterval(function () {
                    remain -= 1;
                    if (remain <= 0) {
                        clearInterval(timer);
                        getCodeBtn.disabled = false;
                        getCodeBtn.textContent = 'Get Code';
                    } else {
                        getCodeBtn.textContent = 'Resend (' + remain + 's)';
                    }
                }, 1000);
            }

            getCodeBtn.addEventListener('click', function () {
                var email = emailInput.value.trim();
                if (!isEmailValid(email)) {
                    alert('Please input a valid email.');
                    return;
                }
                var body = new URLSearchParams();
                body.set('email', email);

                fetch(getApiUrl(API_ENDPOINTS.USER_SEND_VERIFICATION_CODE), {
                    method: 'POST',
                    body: body
                }).catch(function () { /* 供后端捕捉 */ });
                startCountdown();
            });

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var email = emailInput.value.trim();
                var code = (document.getElementById('code').value || '').trim();
                var oldPwd = document.getElementById('previous').value || '';
                var newPwd = document.getElementById('newone').value || '';
                var confirmPwd = document.getElementById('confirmNew').value || '';

                if (!isEmailValid(email)) {
                    alert('Email is invalid.');
                    return;
                }
                if (!code) {
                    alert('Verification code is required.');
                    return;
                }
                if (!oldPwd) {
                    alert('Old password is required.');
                    return;
                }
                if (newPwd.length < 6) {
                    alert('New password must be at least 6 characters.');
                    return;
                }
                if (newPwd !== confirmPwd) {
                    alert('The two new passwords do not match.');
                    return;
                }

                var body = new URLSearchParams();
                body.set('email', email);
                body.set('oldPassword', oldPwd);
                body.set('newPassword', newPwd);
                body.set('verificationCode', code);

                fetch(getApiUrl(API_ENDPOINTS.USER_CHANGE_PASSWORD), {
                    method: 'POST',
                    body: body
                })
                .then(function (res) { return res.json().then(function (d){ return { ok: res.ok, status: res.status, data: d }; }); })
                .then(function (r) {
                    if (r.ok) {
                        alert(r.data.message || '密码修改成功');
                    } else {
                        alert(r.data.error || '密码修改失败：验证码错误、用户不存在或旧密码错误');
                    }
                })
                .catch(function () {
                    alert('Network error.');
                });
            });
        })();
    </script>
</body>
</html>
