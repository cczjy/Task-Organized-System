<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API配置测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .config-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .config-label {
            font-weight: 500;
            color: #555;
            min-width: 150px;
        }

        .config-value {
            flex: 1;
            color: #333;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .current {
            background: #d4edda;
            border-color: #28a745;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #28a745;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .endpoint-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }

        .endpoint-item {
            padding: 10px 15px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .endpoint-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .endpoint-path {
            color: #666;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .test-section {
            margin-top: 20px;
        }

        .test-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .test-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .success {
            color: #28a745;
        }

        .error {
            color: #dc3545;
        }

        .info-box {
            padding: 15px;
            background: #e3f2fd;
            border-radius: 6px;
            border-left: 4px solid #2196f3;
            margin-bottom: 20px;
        }

        .info-box p {
            margin: 5px 0;
            color: #1976d2;
            font-size: 14px;
        }

        .copy-btn {
            padding: 6px 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API配置测试页面</h1>
        <p class="subtitle">快速查看和测试后端API配置</p>

        <div class="info-box">
            <p><strong>💡 使用说明：</strong></p>
            <p>1. 查看当前使用的服务器地址（绿色高亮）</p>
            <p>2. 点击"测试连接"按钮检查服务器是否可用</p>
            <p>3. 修改 config.js 中的 CURRENT_BASE_URL 来切换服务器</p>
        </div>

        <!-- 服务器配置 -->
        <div class="section">
            <div class="section-title">📡 服务器地址配置</div>
            <div id="serverConfigs"></div>
        </div>

        <!-- API端点列表 -->
        <div class="section">
            <div class="section-title">🔗 API端点列表</div>
            <div class="endpoint-list" id="endpointList"></div>
        </div>

        <!-- 连接测试 -->
        <div class="section test-section">
            <div class="section-title">🧪 连接测试</div>
            <button class="test-btn" onclick="testConnection()">测试当前服务器连接</button>
            <button class="test-btn" onclick="copyCurrentUrl()">复制当前服务器地址</button>
            <div id="testResult" class="result-box" style="display: none;"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // 显示服务器配置
        function displayServerConfigs() {
            const container = document.getElementById('serverConfigs');
            const currentUrl = API_CONFIG.CURRENT_BASE_URL;
            
            const configs = [
                { name: 'BASE_URL_1 (主服务器)', value: API_CONFIG.BASE_URL_1 },
                { name: 'BASE_URL_2 (备用服务器)', value: API_CONFIG.BASE_URL_2 },
                { name: 'BASE_URL_LOCAL (本地)', value: API_CONFIG.BASE_URL_LOCAL }
            ];
            
            container.innerHTML = configs.map(config => `
                <div class="config-item ${config.value === currentUrl ? 'current' : ''}">
                    <span class="config-label">${config.name}</span>
                    <span class="config-value">${config.value}</span>
                    ${config.value === currentUrl ? '<span class="badge">当前使用</span>' : ''}
                </div>
            `).join('');
        }

        // 显示API端点
        function displayEndpoints() {
            const container = document.getElementById('endpointList');
            const endpoints = [];
            
            for (const [key, value] of Object.entries(API_ENDPOINTS)) {
                const path = typeof value === 'function' ? value('${id}') : value;
                endpoints.push({ name: key, path: path });
            }
            
            container.innerHTML = endpoints.map(ep => `
                <div class="endpoint-item">
                    <div class="endpoint-name">${ep.name}</div>
                    <div class="endpoint-path">${ep.path}</div>
                </div>
            `).join('');
        }

        // 测试服务器连接
        function testConnection() {
            const resultBox = document.getElementById('testResult');
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<div>正在测试连接...</div>';
            
            const testUrl = getApiUrl(API_ENDPOINTS.USER_LOGIN);
            
            resultBox.innerHTML = `
                <div><strong>测试地址:</strong> ${testUrl}</div>
                <div style="margin-top: 10px;">正在尝试连接服务器...</div>
            `;
            
            fetch(testUrl, {
                method: 'POST',
                body: new URLSearchParams({ email: 'test@test.com', password: 'test' })
            })
            .then(response => {
                resultBox.innerHTML += `
                    <div class="success" style="margin-top: 10px;">
                        ✓ 服务器响应成功！
                        <br>状态码: ${response.status}
                        <br>状态文本: ${response.statusText}
                    </div>
                `;
            })
            .catch(error => {
                resultBox.innerHTML += `
                    <div class="error" style="margin-top: 10px;">
                        ✗ 连接失败！
                        <br>错误信息: ${error.message}
                        <br>
                        <br>可能的原因：
                        <br>1. 服务器未启动
                        <br>2. 网络连接问题
                        <br>3. CORS跨域问题
                        <br>4. 防火墙阻止
                    </div>
                `;
            });
        }

        // 复制当前服务器地址
        function copyCurrentUrl() {
            const url = API_CONFIG.CURRENT_BASE_URL;
            navigator.clipboard.writeText(url).then(() => {
                alert('已复制到剪贴板: ' + url);
            }).catch(err => {
                console.error('复制失败:', err);
                // 使用传统方法
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('已复制到剪贴板: ' + url);
            });
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            displayServerConfigs();
            displayEndpoints();
        });
    </script>
</body>
</html>
